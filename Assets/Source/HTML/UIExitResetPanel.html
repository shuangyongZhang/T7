<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>结束&amp;复位步骤</title>
<style>
  html, body { margin: 0; padding: 0; background: #f8fafc; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  [data-u-type] { box-sizing: border-box; }
  [data-u-type][style*="left:"] { position: absolute; }
  text, image { display: block; }
  [data-u-type="text"] { display: flex; align-items: center; white-space: pre-wrap; line-height: 1.3; overflow: hidden; }
  [data-u-type="image"] { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.06) 0 8px, transparent 0 16px); }
  [data-u-type="button"] { display: block; border: 0; padding: 0; font-family: inherit; cursor: pointer; }
</style>
</head>
<body>
<div id="u-stage">
<div data-u-type="div" data-u-name="UIExitResetPanel" style="width: 1920px; height: 1080px; background-color: #f8fafc;">
  <div data-u-type="image" data-u-name="TopDivider" style="left: 72px; top: 66px; width: 1776px; height: 2px; background-color: #1456f0;"></div>
  <div data-u-type="text" data-u-name="DateTimeText" style="left: 656px; top: 28px; width: 608px; height: 26px; color: #64748b; font-size: 14px; text-align: center;">2026-01-21 | 01:23</div>
  <div data-u-type="text" data-u-name="ExitResetTitleText" style="left: 80px; top: 92px; width: 900px; height: 48px; color: #222222; font-size: 28px; text-align: left;">结束&amp;复位步骤</div>

  <div data-u-type="text" data-u-name="ResetStep1Text" style="left: 80px; top: 190px; width: 620px; height: 44px; color: #222222; font-size: 23px; text-align: left;">1. 减重归零</div>
  <div data-u-type="text" data-u-name="ResetStep2Text" style="left: 80px; top: 290px; width: 720px; height: 44px; color: #222222; font-size: 23px; text-align: left;">2. 解开绑带并移开训练手臂</div>
  <div data-u-type="text" data-u-name="ResetStep3Text" style="left: 80px; top: 390px; width: 720px; height: 44px; color: #222222; font-size: 23px; text-align: left;">3. 机械臂移至初始位</div>

  <div data-u-type="div" data-u-name="UnloadingValueBox" style="left: 1050px; top: 210px; width: 230px; height: 68px; background-color: #ffffff; border: 2px solid #1456f0;">
    <div data-u-type="text" data-u-name="UnloadingValueText" style="left: 8px; top: 8px; width: 214px; height: 52px; color: #1456f0; font-size: 28px; text-align: center;">0.0 kg</div>
  </div>
  <button data-u-type="button" data-u-name="DecreaseUnloadingButton" style="left: 1300px; top: 210px; width: 72px; height: 68px; background-color: #1456f0; color: #ffffff; font-size: 34px;">↓</button>
  <button data-u-type="button" data-u-name="ConfirmUnloadingButton" style="left: 1392px; top: 210px; width: 72px; height: 68px; background-color: #1456f0; color: #ffffff; font-size: 32px;">✓</button>
  <button data-u-type="button" data-u-name="ZeroButton" style="left: 1484px; top: 210px; width: 160px; height: 68px; background-color: #f59e0b; color: #ffffff; font-size: 24px;">归零</button>

  <div data-u-type="image" data-u-name="ResetPhoto" style="left: 650px; top: 520px; width: 900px; height: 404px; background-color: #ffffff;"></div>

  <div data-u-type="text" data-u-name="ExitResetDeviceText" style="left: 80px; top: 930px; width: 620px; height: 28px; color: #8e8e93; font-size: 13px; text-align: left;">设备通讯未接入 · 机械臂动作接口待接入</div>
  <div data-u-type="text" data-u-name="ResetStatusText" style="left: 80px; top: 970px; width: 1100px; height: 32px; color: #45515e; font-size: 14px; text-align: left;">减重数值仅用于展示，可通过向下箭头调小或点击归零。</div>
  <button data-u-type="button" data-u-name="CompleteButton" style="left: 1580px; top: 944px; width: 220px; height: 64px; background-color: #1456f0; color: #ffffff; font-size: 24px;">完成</button>
</div>
</div>
<script>
(function () {
  var texts = document.querySelectorAll('[data-u-type="text"]');
  for (var i = 0; i < texts.length; i++) texts[i].textContent = texts[i].textContent.trim();
})();
</script>
</body>
</html>
