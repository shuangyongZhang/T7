<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主界面外壳（UI 原型预览 / Unity 数据文件）</title>
<style>
    /* ── 预览外壳：只为浏览器服务，Unity 完全忽略，请勿修改 ────── */
    html, body { margin: 0; padding: 0; background: #0a0a0a; }
    body {
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    /* ── 约束堆叠：与 Unity 端求解规则一一对应 ─────────────────── */
    [data-u-type] { box-sizing: border-box; }
    [data-u-layout="v"] { display: flex; flex-direction: column; flex-wrap: nowrap; align-items: stretch; justify-content: flex-start; }
    [data-u-layout="h"] { display: flex; flex-direction: row;    flex-wrap: nowrap; align-items: stretch; justify-content: flex-start; }
    /* 缺省尺寸与 Unity 一致：纵向容器子节点默认高 40，横向容器子节点默认宽 100 */
    [data-u-layout="v"] > * { flex: 0 0 auto; height: 40px; }
    [data-u-layout="h"] > * { flex: 0 0 auto; width: 100px; }

    /* ── 控件外观：Unity 端由 UGUI 组件渲染，此处用 CSS 模拟 ───── */
    text, image { display: block; }
    /* 垂直居中与 Unity 端 TMP 的默认 Middle 对齐保持一致 */
    [data-u-type="text"]     { display: flex; align-items: center; white-space: pre-wrap; line-height: 1.2; overflow: hidden; }
    [data-u-type="image"]    { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 8px, rgba(0,0,0,0) 8px 16px); }
    [data-u-type="button"]   { display: block; border: 0; padding: 0; font-family: inherit; cursor: pointer; }
    [data-u-type="input"]    { display: block; border: 1px solid rgba(255,255,255,.18); padding: 0 12px; font-family: inherit; }
    [data-u-type="dropdown"] { display: block; border: 1px solid rgba(255,255,255,.18); padding: 0 8px; font-family: inherit; }
    [data-u-type="input"]::placeholder { color: rgba(255,255,255,.35); }

    [data-u-type="toggle"]   { display: flex; align-items: center; }
    [data-u-type="toggle"]::before {
        content: ""; width: 1.05em; height: 1.05em; border-radius: 999px;
        background: currentColor; margin-right: .5em; flex: 0 0 auto;
    }
    [data-u-type="toggle"][data-u-checked="false"]::before {
        background: rgba(0,0,0,0); box-shadow: inset 0 0 0 2px currentColor;
    }

    [data-u-type="radio"]    { display: flex; align-items: center; }
    [data-u-type="radio"]::before {
        content: ""; width: .9em; height: .9em; border-radius: 999px;
        box-shadow: inset 0 0 0 2px currentColor; margin-right: .5em; flex: 0 0 auto;
    }
    [data-u-type="radio"][data-u-checked="true"]::before { background: currentColor; }

    [data-u-type="slider"]   { position: relative; border-radius: 999px; overflow: hidden; }
    [data-u-type="slider"]::before {
        content: ""; position: absolute; left: 0; top: 0; bottom: 0;
        width: var(--u-val, 50%); background: currentColor;
    }
    [data-u-type="slider"]::after {
        content: ""; position: absolute; top: 0; bottom: 0; left: var(--u-val, 50%);
        width: 4px; margin-left: -2px; background: #fff; opacity: .9;
    }

    [data-u-type="scroll"]   { position: relative; overflow: auto; border: 1px dashed rgba(255,255,255,.22); }
    [data-u-type="scroll"]::before {
        content: "滚动区域 ScrollView"; position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        color: rgba(255,255,255,.28); font-size: 20px;
    }

</style>
</head>
<body>

<div id="u-stage">

<div data-u-type="div" data-u-name="UIMainPanel" data-u-layout="v" style="width: 1920px; height: 1080px; background-color: rgba(0,0,0,0);">

  <!-- 模块内容容器：先声明，保证顶部栏与导航栏绘制在其上层 -->
  <div data-u-type="div" data-u-name="Content" style="left: 0px; top: 0px; width: 1920px; height: 1080px; background-color: rgba(0,0,0,0);"></div>

  <!-- ─── Top Global Appbar (HTML 红框区域 1) ─────────────────────── -->
  <div data-u-type="div" data-u-name="HeaderBar" style="left: 0px; top: 0px; width: 1920px; height: 56px; background-color: #ffffff;">
    <div data-u-type="div" data-u-name="BrandLogoBox" style="left: 20px; top: 12px; width: 32px; height: 32px; background-color: #1456f0;">
      <div data-u-type="text" data-u-name="BrandLogoText" style="left: 0px; top: 4px; width: 32px; height: 24px; color: #ffffff; font-size: 16px; text-align: center;">AG</div>
    </div>
    <div data-u-type="text" data-u-name="AppNameText" style="left: 64px; top: 12px; width: 280px; height: 32px; color: #222222; font-size: 16px; text-align: left;">上肢智能康复训练与评估系统</div>

      <div data-u-type="text" data-u-name="CurrentPatientNameText" style="left: 92px; top: 2px; width: 90px; height: 28px; color: #222222; font-size: 12px; text-align: left;">未选择</div>
      <div data-u-type="text" data-u-name="CurrentPatientMetaText" style="left: 184px; top: 2px; width: 105px; height: 28px; color: #8e8e93; font-size: 12px; text-align: left;">(男 · 0岁)</div>
      <div data-u-type="text" data-u-name="MRNLabelText" style="left: 300px; top: 2px; width: 58px; height: 28px; color: #8e8e93; font-size: 12px; text-align: left;">病历号:</div>
      <div data-u-type="text" data-u-name="CurrentPatientMRNText" style="left: 360px; top: 2px; width: 130px; height: 28px; color: #222222; font-size: 12px; text-align: left;">-</div>
      <div data-u-type="text" data-u-name="DiagnosisText" style="left: 500px; top: 2px; width: 184px; height: 28px; color: #45515e; font-size: 12px; text-align: right;">诊断: 未选择患者</div>
    </div>

    <div data-u-type="div" data-u-name="DeviceStatusChip" style="left: 1290px; top: 14px; width: 260px; height: 28px; background-color: #e8ffea;">
      <div data-u-type="div" data-u-name="DeviceStatusDot" style="left: 12px; top: 10px; width: 7px; height: 7px; background-color: #16a34a;"></div>
      <div data-u-type="text" data-u-name="DeviceStatusText" style="left: 26px; top: 0px; width: 226px; height: 28px; color: #16a34a; font-size: 12px; text-align: center;">上肢机械臂在线 · 01号机</div>
    </div>

    <div data-u-type="div" data-u-name="UserBadge" style="left: 1570px; top: 12px; width: 300px; height: 32px; background-color: #fafafa;">
      <div data-u-type="div" data-u-name="UserAvatarBox" style="left: 4px; top: 4px; width: 24px; height: 24px; background-color: #181e25;">
        <div data-u-type="text" data-u-name="UserAvatarText" style="left: 0px; top: 0px; width: 24px; height: 24px; color: #ffffff; font-size: 11px; text-align: center;">医</div>
      </div>
      <div data-u-type="text" data-u-name="UserNameText" style="left: 36px; top: 0px; width: 208px; height: 32px; color: #222222; font-size: 12px; text-align: left;">李主治医师 (管理员)</div>
      <button data-u-type="button" data-u-name="LogoutButton" style="left: 250px; top: 4px; width: 44px; height: 24px; background-color: #f0f0f0; color: #45515e; font-size: 12px;">注销</button>
    </div>
    <button data-u-type="button" data-u-name="QuitButton" style="left: 1880px; top: 12px; width: 32px; height: 32px; background-color: #fafafa; color: #45515e; font-size: 16px;">×</button>
    <div data-u-type="image" data-u-name="HeaderDivider" style="left: 0px; top: 55px; width: 1920px; height: 1px; background-color: #f2f3f5;"></div>
  </div>

  <!-- ─── Left Primary Nav Rail (HTML 红框区域 2) ─────────────────── -->
  <div data-u-type="div" data-u-name="NavRail" style="left: 0px; top: 56px; width: 84px; height: 1024px; background-color: #fafafa;">

    <button data-u-type="button" data-u-name="NavPatientButton" style="left: 8px; top: 16px; width: 68px; height: 62px; background-color: #ffffff; color: #1456f0; font-size: 15px;">
      <div data-u-type="text" data-u-name="Icon" style="left: 0px; top: 12px; width: 68px; height: 22px; color: #1456f0; font-size: 19px; text-align: center;">●</div>
      <div data-u-type="text" data-u-name="Label" style="left: 0px; top: 36px; width: 68px; height: 16px; color: #1456f0; font-size: 11px; text-align: center;">患者</div>
      <div data-u-type="image" data-u-name="ActiveIndicator" style="left: -8px; top: 19px; width: 4px; height: 24px; background-color: #1456f0;"></div>
    </button>
    <button data-u-type="button" data-u-name="NavAssessmentButton" style="left: 8px; top: 90px; width: 68px; height: 62px; background-color: rgba(0,0,0,0); color: #45515e; font-size: 15px;">
      <div data-u-type="text" data-u-name="Icon" style="left: 0px; top: 12px; width: 68px; height: 22px; color: #45515e; font-size: 19px; text-align: center;">▲</div>
      <div data-u-type="text" data-u-name="Label" style="left: 0px; top: 36px; width: 68px; height: 16px; color: #45515e; font-size: 11px; text-align: center;">评估</div>
      <div data-u-type="image" data-u-name="ActiveIndicator" style="left: -8px; top: 19px; width: 4px; height: 24px; background-color: #1456f0;"></div>
    </button>
    <button data-u-type="button" data-u-name="NavTrainingButton" style="left: 8px; top: 164px; width: 68px; height: 62px; background-color: rgba(0,0,0,0); color: #45515e; font-size: 15px;">
      <div data-u-type="text" data-u-name="Icon" style="left: 0px; top: 12px; width: 68px; height: 22px; color: #45515e; font-size: 19px; text-align: center;">◆</div>
      <div data-u-type="text" data-u-name="Label" style="left: 0px; top: 36px; width: 68px; height: 16px; color: #45515e; font-size: 11px; text-align: center;">训练</div>
      <div data-u-type="image" data-u-name="ActiveIndicator" style="left: -8px; top: 19px; width: 4px; height: 24px; background-color: #1456f0;"></div>
    </button>
    <button data-u-type="button" data-u-name="NavReportButton" style="left: 8px; top: 238px; width: 68px; height: 62px; background-color: rgba(0,0,0,0); color: #45515e; font-size: 15px;">
      <div data-u-type="text" data-u-name="Icon" style="left: 0px; top: 12px; width: 68px; height: 22px; color: #45515e; font-size: 19px; text-align: center;">■</div>
      <div data-u-type="text" data-u-name="Label" style="left: 0px; top: 36px; width: 68px; height: 16px; color: #45515e; font-size: 11px; text-align: center;">报告</div>
      <div data-u-type="image" data-u-name="ActiveIndicator" style="left: -8px; top: 19px; width: 4px; height: 24px; background-color: #1456f0;"></div>
    </button>
    <button data-u-type="button" data-u-name="NavSettingButton" style="left: 8px; top: 312px; width: 68px; height: 62px; background-color: rgba(0,0,0,0); color: #45515e; font-size: 15px;">
      <div data-u-type="text" data-u-name="Icon" style="left: 0px; top: 12px; width: 68px; height: 22px; color: #45515e; font-size: 19px; text-align: center;">★</div>
      <div data-u-type="text" data-u-name="Label" style="left: 0px; top: 36px; width: 68px; height: 16px; color: #45515e; font-size: 11px; text-align: center;">设置</div>
      <div data-u-type="image" data-u-name="ActiveIndicator" style="left: -8px; top: 19px; width: 4px; height: 24px; background-color: #1456f0;"></div>
    </button>

    <div data-u-type="image" data-u-name="NavRailDivider" style="left: 83px; top: 0px; width: 1px; height: 1024px; background-color: #f2f3f5;"></div>
  </div>

</div>

</div>

<script>
(function () {
    var stage = document.getElementById('u-stage');

    // data-u-gap / data-u-pad 在 Unity 端由 C# 求解，在浏览器端翻译成真正的 CSS
    var boxes = stage.querySelectorAll('[data-u-gap],[data-u-pad]');
    for (var i = 0; i !== boxes.length; i++) {
        var g = boxes[i].getAttribute('data-u-gap');
        var p = boxes[i].getAttribute('data-u-pad');
        if (g) boxes[i].style.gap = g + 'px';
        if (p) boxes[i].style.padding = p + 'px';
    }

    // 文本节点去首尾空白，与 Unity 端 Trim 行为一致
    var texts = stage.querySelectorAll('[data-u-type="text"]');
    for (var j = 0; j !== texts.length; j++) {
        texts[j].textContent = texts[j].textContent.replace(/^[\s\uFEFF]+|[\s\uFEFF]+$/g, '');
    }

    // 滑动条进度
    var sliders = stage.querySelectorAll('[data-u-type="slider"]');
    for (var k = 0; k !== sliders.length; k++) {
        var v = parseFloat(sliders[k].getAttribute('data-u-value'));
        if (isNaN(v)) v = 0.5;
        if (v > 1) v = v / 100;
        v = Math.max(0, Math.min(1, v));
        sliders[k].style.setProperty('--u-val', (v * 100) + '%');
    }

})();
</script>

</body>
</html>
